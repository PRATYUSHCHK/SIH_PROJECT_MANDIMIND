services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mandimind_mongo:/data/db

  ml:
    build: ./ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATA_MODE: simulated

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/mandimind
      JWT_SECRET: ${JWT_SECRET:-mandimind-demo-secret-change-me}
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      CORS_ORIGIN: http://localhost:5173
      ML_SERVICE_URL: http://ml:8000
      DATA_MODE: simulated
    depends_on:
      - mongo
      - ml

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - api

volumes:
  mandimind_mongo:
